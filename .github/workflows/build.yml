name: Build & Test
on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test App
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest

      - name: Verify Firebase-free path compiles
        # No `-Pinclude-telemetry` flag → noop bindings + no google-services.json
        # required. Compile both flavors to confirm neither depends on Firebase
        # being on the classpath when the user opts out.
        run: ./gradlew :app:compileMihonDebugKotlin :app:compileMihonmodDebugKotlin

      - name: Restore google-services.json from secret
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          test -s app/google-services.json
          echo "google-services.json restored ($(wc -c < app/google-services.json) bytes)"

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration

      - name: Upload test report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest

      - name: Build app
        # When the GOOGLE_SERVICES_JSON_BASE64 secret is set, the previous step
        # restores app/google-services.json and we build with -Pinclude-telemetry
        # so the Firebase / cloud-sync variant ships. Otherwise we fall back to
        # the no-Firebase / noop path so forks without a Firebase project can
        # still pass CI. Both `mihon` and `mihonmod` flavors are produced so a
        # fork distribution can offer either: drop-in Mihon update, or a
        # side-by-side install named MihonMod.
        run: |
          if [ -s app/google-services.json ]; then
            ./gradlew assembleMihonRelease assembleMihonmodRelease -Pinclude-telemetry -Penable-updater
          else
            ./gradlew assembleMihonRelease assembleMihonmodRelease -Penable-updater
          fi

      - name: Upload Mihon APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mihon-arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/mihon/release/app-mihon-arm64-v8a-release-unsigned.apk

      - name: Upload MihonMod APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mihonmod-arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/mihonmod/release/app-mihonmod-arm64-v8a-release-unsigned.apk

      - name: Upload mapping
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/
